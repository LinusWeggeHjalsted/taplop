<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taplop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #unity-container {
            /* Dimensions set dynamically via JavaScript for pixel-perfect scaling */
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #unity-progress-bar-empty {
            width: 200px;
            height: 20px;
            background: #2B053A;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #EA7FAF;
            transition: width 0.3s;
        }

        #fullscreen-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #EA7FAF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }

        #fullscreen-button:hover {
            background: #79357B;
        }

        #unity-container.fullscreen {
            /* Dimensions set dynamically via JavaScript for pixel-perfect scaling */
        }
    </style>
</head>
<body>
    <button id="fullscreen-button">Fullscreen</button>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        // Apply initial viewport scaling
        function applyViewportScale() {
            const baseWidth = 960;
            const baseHeight = 540;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            // Calculate scale in 0.5 increments
            const scaleX = Math.floor((viewportWidth / baseWidth) * 2) / 2;
            const scaleY = Math.floor((viewportHeight / baseHeight) * 2) / 2;
            const scale = Math.max(0.5, Math.min(scaleX, scaleY)); // Minimum 0.5x scale

            container.style.width = (baseWidth * scale) + "px";
            container.style.height = (baseHeight * scale) + "px";
        }

        // Apply scaling on load
        applyViewportScale();

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/docs.loader.js";
        var config = {
            dataUrl: buildUrl + "/docs.data",
            frameworkUrl: buildUrl + "/docs.framework.js",
            codeUrl: buildUrl + "/docs.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "LinusWH",
            productName: "taplop",
            productVersion: "v0.1.5 - gameplay demo",
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";

                // Fullscreen functionality with pixel-perfect scaling
                var fullscreenButton = document.querySelector("#fullscreen-button");

                // Calculate optimal integer scale for pixel-perfect rendering
                function calculatePixelPerfectScale() {
                    const baseWidth = 960;
                    const baseHeight = 540;
                    const screenWidth = window.innerWidth;
                    const screenHeight = window.innerHeight;

                    // Find largest integer multiplier that fits the screen
                    const scaleX = Math.floor(screenWidth / baseWidth);
                    const scaleY = Math.floor(screenHeight / baseHeight);
                    const scale = Math.min(scaleX, scaleY);

                    return {
                        scale: Math.max(1, scale), // Minimum 1x scale
                        width: baseWidth * Math.max(1, scale),
                        height: baseHeight * Math.max(1, scale)
                    };
                }


                fullscreenButton.onclick = () => {
                    if (!document.fullscreenElement) {
                        const scalingInfo = calculatePixelPerfectScale();
                        container.style.width = scalingInfo.width + "px";
                        container.style.height = scalingInfo.height + "px";
                        container.classList.add("fullscreen");

                        container.requestFullscreen().then(() => {
                            unityInstance.SetFullscreen(1);
                        }).catch((err) => {
                            console.error("Error attempting to enable fullscreen:", err);
                            container.classList.remove("fullscreen");
                        });
                    } else {
                        document.exitFullscreen();
                    }
                };

                // Handle fullscreen exit - reset to default size
                document.addEventListener("fullscreenchange", () => {
                    if (!document.fullscreenElement) {
                        container.style.width = "";
                        container.style.height = "";
                        container.classList.remove("fullscreen");
                        unityInstance.SetFullscreen(0);
                        applyViewportScale();
                    }
                });
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
