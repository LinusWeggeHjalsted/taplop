<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #unity-container {
            /* Dimensions set dynamically via JavaScript for pixel-perfect scaling */
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #unity-progress-bar-empty {
            width: 200px;
            height: 20px;
            background: #2B053A;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #EA7FAF;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        // Apply initial viewport scaling
        function applyViewportScale() {
            const baseWidth = 960;
            const baseHeight = 540;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            // Calculate scale in 0.5 increments
            const scaleX = Math.floor((viewportWidth / baseWidth) * 2) / 2;
            const scaleY = Math.floor((viewportHeight / baseHeight) * 2) / 2;
            const scale = Math.max(0.5, Math.min(scaleX, scaleY)); // Minimum 0.5x scale

            container.style.width = (baseWidth * scale) + "px";
            container.style.height = (baseHeight * scale) + "px";
        }

        // Apply scaling on load
        applyViewportScale();

        // Add window resize listener for automatic resizing
        window.addEventListener('resize', applyViewportScale);

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
